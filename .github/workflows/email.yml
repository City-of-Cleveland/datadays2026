name: Send mail
on:
  workflow_dispatch:
jobs:
  steps:
    name: help
    uses: dawidd6/action-send-mail@v17
    with:
    # Specify connection via URL (replaces server_address, server_port, secure,
    # username and password)
    #
    # Format:
    #
    #  * smtp://user:password@server:port
    #  * smtp+starttls://user:password@server:port
    # connection_url: ${{secrets.MAIL_CONNECTION}}

    # Required mail server address if not connection_url:
      server_address: smtp-mail.outlook.com

    # Server port, default 25:
      server_port: 465

    # Optional whether this connection use TLS (default is true if server_port is 465)
      secure: true

    # Optional (recommended) mail server username:
      username: ${{ secrets.MAIL_USERNAME}}

    # Optional (recommended) mail server password:
      password: ${{ secrets.MAIL_PASSWORD}}

    # Required mail subject:
      subject: Github Actions test

    # Optional recipients. Separate multiple addresses by a comma (possibly surrounded by whitespace):
      to: smartinez2@clevelandohio.gov, smurphy3@clevelandohio.gov

    # Required sender (supported formats: see "Supported address formats" below)
      from: 'Luke Skywalker <user@example.com>'

    # Optional plain body:
      body: nice
