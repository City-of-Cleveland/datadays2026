name: 'Email Notification Workflow'

on:
  workflow_dispatch:
  schedule:
    - cron: 0 8 * * Mon

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Convert Notebook"
        run: |
          pip install jupyter
          pip install -r requirements.txt
          jupyter nbconvert --to html --execute analysis.ipynb --no-input
      - name: 'Send Mail'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          # connection_url: ${{ secrets.MAIL_CONNECTION }}
          username: ${{secrets.MAIL_USERNAME}}
          password: ${{secrets.MAIL_PASSWORD}}
          subject: Github Actions Test
          to: smartinez2@clevelandohio.gov,smurphy3@clevelandohio.gov,samjmartinez218@gmail.com,shelleymurphy221@gmail.com
          from: LucasDePiglio@example.com
          html_body: file://analysis.html
